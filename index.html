<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniApp Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        
        /* ခလုတ်များ အစီအစဉ် */
        .btn-column { 
            display: flex; flex-direction: column; gap: 10px; 
        }
        
        /* ခလုတ်ပုံစံ */
        .btn { 
            background: #4caf50; color: white; border: none; 
            padding: 15px; border-radius: 8px; font-size: 16px; 
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        
        /* Premium/Credit ခလုတ်များ */
        .btn-premium { background: #607d8b; }
        .btn-shop { background: #ff9800; }
        .credit-header { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="credit-header">လက်ကျန် Credit: 10</div>
    
    <div class="btn-column">
        <button class="btn">English/China Videos</button>
        <button class="btn">အလိုအလျောက် Recap</button>
        <button class="btn">ဘာသာပြန် ဇာတ်ကား</button>
        <button class="btn">video ဒေါင်းလုပ်</button>
        <button class="btn btn-premium">ဓာတ်ပုံဖန်တီးမည်</button>
        <button class="btn btn-premium">ဘာသာပြန်မည်</button>
        <button class="btn">စာသားမှအသံ</button>
        <button class="btn btn-shop">Shop</button>
        <button class="btn">English</button>
    </div>
</div>

</body>
</html>
