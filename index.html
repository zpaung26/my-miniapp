<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Subtitle Tool</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* CSS ပိုင်း - UI ဒီဇိုင်း */
        body { 
            font-family: sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            display: flex; justify-content: center; padding: 20px; min-height: 100vh; margin: 0;
        }
        .container { 
            width: 100%; max-width: 400px; background: white; padding: 25px; 
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .credit-box { 
            text-align: center; font-size: 20px; font-weight: bold; 
            color: #444; margin-bottom: 20px; padding: 10px; background: #eef; border-radius: 10px;
        }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input, select { 
            width: 100%; padding: 12px; margin: 8px 0 15px 0; 
            border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; 
        }
        button { 
            width: 100%; padding: 15px; margin: 8px 0; border: none; 
            border-radius: 12px; font-size: 16px; cursor: pointer; color: white; 
            transition: 0.3s; font-weight: bold;
        }
        .btn-upload { background: #28a745; }
        .btn-subtitle { background: #007bff; }
        .btn-close { background: #dc3545; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Video Subtitle Tool</h2>
        <div class="credit-box" id="credit">လက်ကျန် Credit: 10</div>
        
        <label>ဗီဒီယို Link ထည့်ပါ:</label>
        <input type="text" id="videoLink" placeholder="https://youtube.com/...">
        
        <label>ဘာသာစကား:</label>
        <select id="lang">
            <option value="my">မြန်မာ</option>
            <option value="en">English</option>
        </select>
        
        <button class="btn-upload" onclick="alert('ဗီဒီယို တင်ရန် ခလုတ်ကို နှိပ်ထားသည်')">📥 ဗီဒီယို တင်ရန်</button>
        <button class="btn-subtitle" onclick="process()">📝 စာတန်းစတင်ထိုးရန်</button>
        <button class="btn-close" onclick="closeApp()">❌ ပိတ်ရန်</button>
    </div>

    <script>
        // JavaScript ပိုင်း - လုပ်ဆောင်ချက်များ
        let tg = window.Telegram.WebApp;
        tg.expand();

        function process() {
            let link = document.getElementById('videoLink').value;
            if(link === "") {
                alert("ကျေးဇူးပြု၍ Link ထည့်ပေးပါ");
            } else {
                alert("စတင်လုပ်ဆောင်နေပါပြီ: " + link);
            }
        }

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
