<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Recapper Group</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 450px; margin: auto; }
        .header { text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #333; }
        .btn-column { display: flex; flex-direction: column; gap: 12px; }

        .lang-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }

        /* 3D Popup Style */
        .confirm-msg { 
            display: none; position: absolute; top: -55px; width: 100%;
            background: #ffffff; padding: 10px 0; border-radius: 8px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); 
            border: 1px solid #ddd; color: #d32f2f;
            font-weight: bold; cursor: pointer; z-index: 10; text-align: center;
        }

        /* ခလုတ်ကို လုံးဝအငြိမ်ထားတဲ့နေရာ */
        .btn { 
            width: 100%;        /* အကျယ် 100% */
            height: 60px;       /* အမြင့်ကို ပုံသေထားလိုက်တာပါ (ဒါဆို မသေး/မကြီးတော့ဘူး) */
            display: flex;      /* စာသားကို အလယ်တည့်တည့်ရောက်အောင် */
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: #ffffff; color: #333; border: none; padding: 0 16px; 
            border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; 
            transition: 0.1s; border-bottom: 5px solid #ccc; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active { transform: translateY(4px); border-bottom: none; box-shadow: none; }
        .btn-primary { background: #4caf50; color: white; border-bottom: 5px solid #388e3c; }
        .btn-premium { background: #607d8b; color: white; border-bottom: 5px solid #455a64; }
        .btn-shop { background: #ff9800; color: white; border-bottom: 5px solid #e65100; }
    </style>
</head>
<body>

<div class="container">
    <div class="header" id="mainHeader">Myanmar Recapper Group</div>
    
    <div class="btn-column">
        <button class="btn btn-premium" id="btn1">English/China Videos</button>
        <button class="btn btn-primary" id="btn2">Auto Recap</button>
        <button class="btn btn-primary" id="btn3">Translated Movies</button>
        <button class="btn btn-primary" id="btn4">Video Download</button>
        <button class="btn btn-premium" id="btn5">Create Photos</button>
        <button class="btn btn-premium" id="btn6">Translate</button>
        <button class="btn btn-primary" id="btn7">Text to Speech</button>
        <button class="btn btn-primary" id="btn8">Manual Edit Videos</button>
        <button class="btn btn-shop" id="btn10">🛒 Shop</button>
        
        <div class="lang-wrapper">
            <div id="confirmMsg" class="confirm-msg" onclick="applyLanguageChange()">🇲🇲 မြန်မာသို့ ပြောင်းမည်</div>
            <button class="btn" id="langBtn" onclick="showConfirm()">🇬🇧 English</button>
        </div>
    </div>
</div>

<script>
    let isEnglish = true;

    function showConfirm() {
        let msg = document.getElementById("confirmMsg");
        msg.style.display = (msg.style.display === "block") ? "none" : "block";
    }

    function applyLanguageChange() {
        document.getElementById("confirmMsg").style.display = "none";
        let btn = document.getElementById("langBtn");
        let header = document.getElementById("mainHeader");
        let confirmMsg = document.getElementById("confirmMsg");
        
        let ids = ["btn1", "btn2", "btn3", "btn4", "btn5", "btn6", "btn7", "btn8", "btn10"];

        if (isEnglish) {
            btn.innerText = "🇲🇲 မြန်မာ";
            confirmMsg.innerText = "🇬🇧 English";
            header.innerText = "Myanmar Recap Group";
            const myTexts = ["အင်္ဂလိပ်/တရုတ် ဗီဒီယိုများ", "အလိုအလျောက် Recap", "ဘာသာပြန် ဇာတ်ကား", "Video ဒေါင်းလုပ်", "ဓာတ်ပုံဖန်တီးမည်", "ဘာသာပြန်မည်", "စာသားမှအသံ", "Manual Edit Videos", "🛒 ဆိုင်"];
            ids.forEach((id, index) => document.getElementById(id).innerText = myTexts[index]);
            isEnglish = false;
        } else {
            btn.innerText = "🇬🇧 English";
            confirmMsg.innerText = "🇲🇲 မြန်မာ";
            header.innerText = "Myanmar Recap Group";
            const enTexts = ["English/China Videos", "Auto Recap", "Translated Movies", "Video Download", "Create Photos", "Translate", "Text to Speech", "Manual Edit Videos", "🛒 Shop"];
            ids.forEach((id, index) => document.getElementById(id).innerText = enTexts[index]);
            isEnglish = true;
        }
    }
</script>

</body>
</html>
