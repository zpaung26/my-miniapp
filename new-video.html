<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; overflow: hidden; font-family: sans-serif; }
        
        /* အဓိက Structure */
        .page { display: flex; flex-direction: column; height: 100vh; }

        /* Preview Area (45%) */
        .preview-area { height: 45%; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #videoPreview { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* Timeline Area (40%) */
        .timeline-area { height: 40%; background: #1a1a1a; overflow: hidden; border-top: 1px solid #333; }

        /* Toolbar (12%) */
        .toolbar { height: 12%; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        
        /* Space (3%) */
        .space { height: 3%; background: #000; }

        .tool-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="page">
    <div class="preview-area" id="previewArea">
        <video id="videoPreview" controls style="display: none;"></video>
        <button id="importBtn" onclick="document.getElementById('fileInput').click()" style="background: #333; color: white; border: none; padding: 10px 20px;">Import Video</button>
        <input type="file" id="fileInput" style="display: none;" accept="video/*" onchange="loadFile(event)">
    </div>

    <div class="timeline-area">
        <div id="clipDisplay" style="display: none; background: #333; margin: 10px; padding: 10px; width: 100px;">Video Clip</div>
    </div>

    <div class="toolbar">
        <div class="tool-item"><span>✂️</span>Edit</div>
        <div class="tool-item"><span>🎵</span>Audio</div>
        <div class="tool-item"><span>📝</span>Text</div>
        <div class="tool-item"><span>✨</span>Effects</div>
        <div class="tool-item"><span>🖼️</span>Overlay</div>
    </div>
    
    <div class="space"></div>
</div>

<script>
    function loadFile(event) {
        const video = document.getElementById('videoPreview');
        const btn = document.getElementById('importBtn');
        const clip = document.getElementById('clipDisplay');
        const file = event.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.style.display = 'block';
            btn.style.display = 'none';
            clip.style.display = 'block';
        }
    }
</script>
</body>
</html>
