<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P11 - Professional Timeline</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        .page { display: flex; flex-direction: column; height: 100dvh; }

        /* Timeline Area */
        .timeline-area { height: 45dvh; background: #1a1a1a; border-top: 1px solid #333; position: relative; display: flex; flex-direction: column; }
        
        /* Ruler - အလယ်က Playhead နဲ့ ချိန်ညှိထား */
        #timelineRuler { height: 25px; background: #222; display: flex; align-items: flex-end; padding-left: 50vw; color: #888; font-size: 10px; overflow-x: hidden; }
        .tick { width: 40px; flex-shrink: 0; border-left: 1px solid #555; padding-left: 2px; }

        /* Playhead - အလယ်မှာ အသေထားခြင်း */
        #playhead { position: absolute; left: 50vw; top: 25px; bottom: 0; width: 2px; background: #ff4757; z-index: 20; pointer-events: none; }
        #playhead::before { content: ''; position: absolute; top: 0; left: -4px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 8px solid #ff4757; }
        
        .tracks-wrapper { height: 33.33%; display: flex; }
        .side-tools { width: 70px; background: #1a1a1a; z-index: 11; border-right: 1px solid #333; }
        
        /* Container - Playhead နဲ့ ချိန်ညှိရန် padding-left */
        .tracks-container { flex-grow: 1; overflow-x: auto; position: relative; padding-left: 50vw; padding-right: 50vw; }
        .track-row { height: 33.33%; display: flex; align-items: center; padding: 2px 5px; min-width: max-content; }
        
        .video-clip { position: relative; height: 25px; background: #333; border: 1px solid #555; margin-right: 5px; flex-shrink: 0; cursor: pointer; }
        .video-clip video, .video-clip img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="page">
    <div class="timeline-area">
        <div id="timelineRuler"></div>
        <div id="playhead"></div>
        <div class="tracks-wrapper">
            <div class="side-tools"></div>
            <div class="tracks-container" id="scrollContainer">
                <div class="track-row" id="videoTrack"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const scrollContainer = document.getElementById('scrollContainer');
    const ruler = document.getElementById('timelineRuler');
    const videoPreview = document.getElementById('videoPreview');

    // Ruler ဖန်တီးခြင်း
    for (let i = 0; i <= 600; i++) {
        const tick = document.createElement('div');
        tick.className = 'tick';
        const m = Math.floor(i / 60);
        const s = i % 60;
        tick.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        ruler.appendChild(tick);
    }

    // Scroll လုပ်တဲ့အခါ Ruler နဲ့ Timeline ကို Sync လုပ်ခြင်း
    scrollContainer.onscroll = () => {
        ruler.scrollLeft = scrollContainer.scrollLeft;
        
        // အလယ်က Playhead ရဲ့ အချိန်ကို တွက်ချက်ခြင်း
        const currentTime = (scrollContainer.scrollLeft) / 40; 
        if (videoPreview) videoPreview.currentTime = currentTime;
    };
</script>
</body>
</html>
