<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p1 - Editor</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: white; overflow: hidden; }
        .page { display: flex; flex-direction: column; height: 100dvh; }

        /* Preview Area - အခု ဒီမှာပဲ ပေါ်လာတော့မယ် */
        .preview-area { height: 40dvh; background: #000; display: flex; justify-content: center; align-items: center; }
        #previewMedia { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Timeline Area */
        .timeline-area { height: 50dvh; background: #1a1a1a; display: flex; gap: 5px; padding: 10px; overflow-x: auto; }
        .thumb { width: 80px; height: 60px; background: #333; cursor: pointer; }
    </style>
</head>
<body>

<div class="page">
    <div class="preview-area">
        <video id="previewMedia" controls></video>
        <img id="previewImg" style="display:none; max-width:100%; max-height:100%;">
    </div>

    <div class="timeline-area" id="timeline">
        </div>

    <button onclick="document.getElementById('fileInput').click()">Import</button>
    <input type="file" id="fileInput" style="display:none" accept="image/*,video/*" multiple>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const previewVideo = document.getElementById('previewMedia');
    const previewImg = document.getElementById('previewImg');
    const timeline = document.getElementById('timeline');

    fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        for (let file of files) {
            const url = URL.createObjectURL(file);
            
            // 1. ပထမဆုံး ဖိုင်ကို Preview မှာ အရင်ပြမယ်
            if (file.type.startsWith('video')) {
                previewVideo.src = url;
                previewVideo.style.display = 'block';
                previewImg.style.display = 'none';
            } else {
                previewImg.src = url;
                previewImg.style.display = 'block';
                previewVideo.style.display = 'none';
            }

            // 2. ပြီးမှ Timeline မှာ ထည့်မယ်
            const div = document.createElement('div');
            div.className = 'thumb';
            div.style.background = `url(${url}) center/cover`;
            timeline.appendChild(div);
        }
    });
</script>
</body>
</html>
