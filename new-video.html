<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Pro</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Preview Area: အမြဲတမ်း 50% အတိ (လိုက်မပြောင်းပါ) */
        .preview-area {
            height: 50vh; 
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Video Ratio အတိုင်း 50% ထဲမှာပဲ အပြည့်ပေါ်ရန် */
        #videoPreview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Video အချိုးအစားမပျက်စေရ */
        }

        /* အောက်ပိုင်း Timeline + Toolbar (ကျန်တဲ့ 50%) */
        .bottom-panel {
            height: 50vh;
            background: #111;
            display: flex;
            flex-direction: column;
        }
        
        .import-btn { padding: 15px 30px; background: #333; border: 2px dashed #555; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="preview-area" id="previewArea">
        <button class="import-btn" id="importBtn" onclick="document.getElementById('fileInput').click()">Import Video</button>
        <input type="file" id="fileInput" style="display: none;" accept="video/*" onchange="loadFile(event)">
        <video id="videoPreview" controls style="display: none;"></video>
    </div>

    <div class="bottom-panel">
        <div style="flex: 1; padding: 10px; border-bottom: 1px solid #333;">Timeline Area</div>
        <div style="height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center;">
            <div>✂️ Edit</div>
            <div>🎵 Audio</div>
            <div>📝 Text</div>
        </div>
    </div>

    <script>
        function loadFile(event) {
            const video = document.getElementById('videoPreview');
            const btn = document.getElementById('importBtn');
            const file = event.target.files[0];
            
            video.src = URL.createObjectURL(file);
            video.style.display = 'block';
            btn.style.display = 'none';
        }
    </script>
</body>
</html>
