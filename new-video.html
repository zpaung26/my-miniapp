<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P3 - Precise Editor</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        .page { display: flex; flex-direction: column; height: 100dvh; }

        /* Button Area (10%) */
        .top-button-area { height: 10dvh; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid #333; }
        .action-btn { background: #333; border: none; color: white; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; box-shadow: 0 4px 0 #111; }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #111; }

        /* Preview Area (40%) */
        .preview-area { height: 40dvh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #videoPreview, #imgPreview { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        
        /* Timeline Area (40%) */
        .timeline-area { height: 40dvh; background: #1a1a1a; border-top: 1px solid #333; }

        /* Toolbar (10%) */
        .toolbar { height: 10dvh; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .tool-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; cursor: pointer; color: #ccc; }
        .tool-item span { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="page">
    <div class="top-button-area">
        <button class="action-btn" onclick="window.history.back()">✕</button>
        <div style="display: flex; gap: 10px;">
            <button class="action-btn" onclick="document.getElementById('videoInput').click()">Video</button>
            <button class="action-btn" onclick="document.getElementById('imgInput').click()">Photo</button>
            <button class="action-btn" style="background:#007bff; box-shadow: 0 4px 0 #0056b3;">Export</button>
        </div>
    </div>

    <div class="preview-area">
        <video id="videoPreview" controls></video>
        <img id="imgPreview">
        <input type="file" id="videoInput" style="display:none;" accept="video/*" multiple>
        <input type="file" id="imgInput" style="display:none;" accept="image/*" multiple>
    </div>

    <div class="timeline-area"></div>

    <div class="toolbar">
        <div class="tool-item"><span>✂️</span>Edit</div>
        <div class="tool-item"><span>🎵</span>Audio</div>
        <div class="tool-item"><span>📝</span>Text</div>
        <div class="tool-item"><span>✨</span>Effects</div>
        <div class="tool-item"><span>🖼️</span>Overlay</div>
    </div>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const imgInput = document.getElementById('imgInput');
    const videoPreview = document.getElementById('videoPreview');
    const imgPreview = document.getElementById('imgPreview');

    videoInput.addEventListener('change', function(e) {
        if (e.target.files[0]) {
            videoPreview.src = URL.createObjectURL(e.target.files[0]);
            videoPreview.style.display = 'block';
            imgPreview.style.display = 'none';
        }
    });

    imgInput.addEventListener('change', function(e) {
        if (e.target.files[0]) {
            imgPreview.src = URL.createObjectURL(e.target.files[0]);
            imgPreview.style.display = 'block';
            videoPreview.style.display = 'none';
        }
    });
</script>
</body>
</html>
