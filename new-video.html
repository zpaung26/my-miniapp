<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P1 - Video Editor</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: white; overflow: hidden; font-family: sans-serif; }
        .page { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

        .preview-area { height: 40dvh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #videoPreview { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        #imgPreview { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        
        .top-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; }
        .action-btn { background: rgba(0,0,0,0.5); border: 1px solid #444; color: white; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; }

        .timeline-area { height: 50dvh; background: #1a1a1a; border-top: 1px solid #333; position: relative; }
        .toolbar { height: 10dvh; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .tool-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; cursor: pointer; color: #ccc; }
        .tool-item span { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="page">
    <div class="preview-area">
        <div class="top-ui">
            <button class="action-btn" onclick="window.history.back()">✕</button>
            <div style="display: flex; gap: 10px;">
                <button class="action-btn" onclick="document.getElementById('videoInput').click()">Import Video</button>
                <button class="action-btn" onclick="document.getElementById('imgInput').click()">Import Photo</button>
                <button class="action-btn" style="background:#007bff; border:none;">Export</button>
            </div>
        </div>
        
        <video id="videoPreview" controls></video>
        <img id="imgPreview">
        
        <input type="file" id="videoInput" style="display:none;" accept="video/*" multiple>
        <input type="file" id="imgInput" style="display:none;" accept="image/*" multiple>
    </div>

    <div class="timeline-area"></div>

    <div class="toolbar">
        <div class="tool-item"><span>✂️</span>Edit</div>
        <div class="tool-item"><span>🎵</span>Audio</div>
        <div class="tool-item"><span>📝</span>Text</div>
        <div class="tool-item"><span>✨</span>Effects</div>
        <div class="tool-item"><span>🖼️</span>Overlay</div>
    </div>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const imgInput = document.getElementById('imgInput');
    const videoPreview = document.getElementById('videoPreview');
    const imgPreview = document.getElementById('imgPreview');

    videoInput.addEventListener('change', function(e) {
        if (e.target.files[0]) {
            videoPreview.src = URL.createObjectURL(e.target.files[0]);
            videoPreview.style.display = 'block';
            imgPreview.style.display = 'none';
        }
    });

    imgInput.addEventListener('change', function(e) {
        if (e.target.files[0]) {
            imgPreview.src = URL.createObjectURL(e.target.files[0]);
            imgPreview.style.display = 'block';
            videoPreview.style.display = 'none';
        }
    });
</script>

</body>
</html>
