<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P2 - Advanced Import</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        .page { display: flex; flex-direction: column; height: 100dvh; }

        .preview-area { height: 40dvh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #previewVideo, #previewImg { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        
        .top-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; }
        .action-btn { background: #333; border: none; color: white; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; box-shadow: 0 4px 0 #111; }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #111; }

        /* Media Tabs - အသစ်ထည့်ထားသည် */
        .tab-container { display: flex; justify-content: center; background: #1a1a1a; padding: 10px; border-top: 1px solid #333; }
        .tab-btn { color: #888; margin: 0 20px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: #00d4ff; border-bottom: 2px solid #00d4ff; }

        .timeline-area { height: 50dvh; background: #1a1a1a; border-top: 1px solid #333; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 5px; }
        .media-thumb { width: 100%; aspect-ratio: 1; background: #333; cursor: pointer; object-fit: cover; }

        .toolbar { height: 10dvh; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .tool-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: #ccc; cursor: pointer; }
    </style>
</head>
<body>

<div class="page">
    <div class="preview-area">
        <div class="top-ui">
            <button class="action-btn" onclick="window.history.back()">✕</button>
            <button class="action-btn" onclick="document.getElementById('fileInput').click()">Import</button>
        </div>
        <video id="previewVideo" controls></video>
        <img id="previewImg">
        <input type="file" id="fileInput" style="display:none;" accept="image/*,video/*" multiple>
    </div>

    <div class="tab-container">
        <div class="tab-btn active" onclick="filterMedia('video')">Videos</div>
        <div class="tab-btn" onclick="filterMedia('image')">Photos</div>
    </div>

    <div class="timeline-area" id="mediaGrid"></div>

    <div class="toolbar">
        <div class="tool-item"><span>✂️</span>Edit</div>
        <div class="tool-item"><span>🎵</span>Audio</div>
        <div class="tool-item"><span>📝</span>Text</div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const mediaGrid = document.getElementById('mediaGrid');
    const previewVideo = document.getElementById('previewVideo');
    const previewImg = document.getElementById('previewImg');
    let allFiles = [];

    fileInput.addEventListener('change', function(e) {
        allFiles = Array.from(e.target.files);
        filterMedia('video'); // default view
    });

    function filterMedia(type) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(type)));
        mediaGrid.innerHTML = '';
        allFiles.filter(f => f.type.startsWith(type)).forEach(file => {
            const url = URL.createObjectURL(file);
            const img = document.createElement('img');
            img.className = 'media-thumb';
            img.src = url;
            img.onclick = () => {
                if (file.type.startsWith('video')) {
                    previewVideo.src = url;
                    previewVideo.style.display = 'block';
                    previewImg.style.display = 'none';
                } else {
                    previewImg.src = url;
                    previewImg.style.display = 'block';
                    previewVideo.style.display = 'none';
                }
            };
            mediaGrid.appendChild(img);
        });
    }
</script>
</body>
</html>
