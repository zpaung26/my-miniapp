<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>p1 - Video/Photo Editor</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: white; overflow: hidden; font-family: sans-serif; }
        .page { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

        .preview-area { height: 40dvh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #previewMedia { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        
        .top-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; }
        
        .action-btn { 
            background: #333; border: none; color: white; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 13px;
            box-shadow: 0 4px 0 #111; transition: all 0.1s;
        }
        .action-btn:active { box-shadow: 0 0 0 #111; transform: translateY(4px); }

        /* Timeline Area */
        .timeline-area { height: 50dvh; background: #1a1a1a; border-top: 1px solid #333; display: flex; align-items: center; padding: 10px; gap: 10px; overflow-x: auto; }
        .media-thumb { width: 80px; height: 50px; background: #444; border-radius: 4px; object-fit: cover; border: 1px solid #666; }

        .toolbar { height: 10dvh; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .tool-item { display: flex; flex-direction: column; align-items: center; font-size: 9px; cursor: pointer; color: #ccc; }
        .tool-item span { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="page">
    <div class="preview-area">
        <div class="top-ui">
            <button class="action-btn" onclick="window.history.back()">✕</button>
            <div style="display: flex; gap: 10px;">
                <button class="action-btn" onclick="document.getElementById('fileInput').click()">Import</button>
                <button class="action-btn" style="background:#007bff; box-shadow: 0 4px 0 #0056b3;">Export</button>
            </div>
        </div>
        
        <video id="previewMedia" controls></video>
        <input type="file" id="fileInput" style="display:none;" accept="image/*,video/*" multiple>
    </div>

    <div class="timeline-area" id="timelineArea">
        </div>

    <div class="toolbar">
        <div class="tool-item"><span>✂️</span>Edit</div>
        <div class="tool-item"><span>🎵</span>Audio</div>
        <div class="tool-item"><span>📝</span>Text</div>
        <div class="tool-item"><span>✨</span>Effects</div>
        <div class="tool-item"><span>🖼️</span>Overlay</div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const timelineArea = document.getElementById('timelineArea');
    const previewMedia = document.getElementById('previewMedia');

    fileInput.addEventListener('change', function(event) {
        const files = event.target.files;
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const mediaURL = URL.createObjectURL(file);
            
            // Timeline မှာ Thumbnail လေးတွေ ဖန်တီးပေးခြင်း
            const img = document.createElement('img');
            img.src = mediaURL;
            img.className = 'media-thumb';
            img.onclick = () => {
                previewMedia.src = mediaURL;
                previewMedia.style.display = 'block';
            };
            timelineArea.appendChild(img);
        }
    });
</script>

</body>
</html>
