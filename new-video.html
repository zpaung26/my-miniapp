<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; overflow: hidden; font-family: sans-serif; }
        
        .main-wrapper { display: flex; flex-direction: column; height: 100vh; }

        /* Preview Section */
        .preview-area { height: 45vh; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        .top-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 20; }
        .action-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        #videoPreview { width: 100%; height: 100%; object-fit: contain; }

        /* Timeline Section */
        .timeline-area { height: 43vh; background: #1a1a1a; border-top: 1px solid #333; padding: 10px; overflow: auto; }
        .track-ui { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
        .clip { width: 100px; height: 50px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid #555; }

        /* Toolbar Section */
        .toolbar { height: 12vh; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; font-size: 10px; }
        .tool-item { display: flex; flex-direction: column; align-items: center; color: #ccc; cursor: pointer; }
        .tool-icon { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="preview-area">
        <div class="top-ui">
            <button class="action-btn">✕</button>
            <button class="action-btn" style="background: #007bff;">Export</button>
        </div>
        <video id="videoPreview" controls style="display: none;"></video>
        <button id="importBtn" onclick="document.getElementById('fileInput').click()" style="background: #333; border: none; color: white; padding: 10px 20px;">Import Video</button>
        <input type="file" id="fileInput" style="display: none;" accept="video/*" onchange="loadFile(event)">
    </div>

    <div class="timeline-area">
        <div style="font-size: 12px; color: #888;">00:00 | 00:01 | 00:02 | 00:03</div>
        <div class="track-ui">
            <div id="clipDisplay" class="clip" style="display: none;">Clip</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="tool-item"><span class="tool-icon">✂️</span>Edit</div>
        <div class="tool-item"><span class="tool-icon">🎵</span>Audio</div>
        <div class="tool-item"><span class="tool-icon">📝</span>Text</div>
        <div class="tool-item"><span class="tool-icon">✨</span>Effects</div>
        <div class="tool-item"><span class="tool-icon">🖼️</span>Overlay</div>
    </div>
</div>

<script>
    function loadFile(event) {
        const video = document.getElementById('videoPreview');
        const btn = document.getElementById('importBtn');
        const clip = document.getElementById('clipDisplay');
        const file = event.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.style.display = 'block';
            btn.style.display = 'none';
            clip.style.display = 'flex';
        }
    }
</script>
</body>
</html>
