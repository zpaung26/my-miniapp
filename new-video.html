<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Pro</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* အပေါ်ပိုင်း Preview (Ratio အလိုက် အပြောင်းအလဲဖြစ်သည်) */
        .preview-area {
            flex: 1; /* ကျန်တဲ့နေရာကို ယူရန် */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        #videoPreview {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ဒီအချက်က ဗီဒီယို Ratio ကို ထိန်းပေးသည် */
        }

        /* အောက်ပိုင်း Timeline + Toolbar (CapCut စတိုင်) */
        .bottom-panel {
            height: 50vh;
            background: #111;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #333;
        }

        .timeline-area {
            flex: 1;
            padding: 20px;
            overflow-x: auto;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
        }

        .timeline-track {
            height: 60px;
            background: #333;
            border-radius: 8px;
            min-width: 500px;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        .toolbar {
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #000;
        }

        .tool { cursor: pointer; text-align: center; font-size: 10px; }
        .import-btn { position: absolute; padding: 15px 30px; background: #333; border: 2px dashed #555; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="preview-area">
        <button class="import-btn" id="importBtn" onclick="document.getElementById('fileInput').click()">Import Video</button>
        <input type="file" id="fileInput" style="display: none;" accept="video/*" onchange="loadFile(event)">
        <video id="videoPreview" controls style="display: none;"></video>
    </div>

    <div class="bottom-panel">
        <div class="timeline-area">
            <div class="timeline-track">
                <span>Video Track</span>
            </div>
        </div>
        <div class="toolbar">
            <div class="tool">✂️<br>Edit</div>
            <div class="tool">🎵<br>Audio</div>
            <div class="tool">📝<br>Text</div>
            <div class="tool">✨<br>Effects</div>
            <div class="tool">🖼️<br>Overlay</div>
        </div>
    </div>

    <script>
        function loadFile(event) {
            const video = document.getElementById('videoPreview');
            const btn = document.getElementById('importBtn');
            const file = event.target.files[0];
            
            video.src = URL.createObjectURL(file);
            video.style.display = 'block';
            btn.style.display = 'none';
        }
    </script>
</body>
</html>
