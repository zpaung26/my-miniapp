<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P4 - Video Editor Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        .page { display: flex; flex-direction: column; height: 100dvh; }

        /* Button Area (5%) */
        .top-button-area { height: 5dvh; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid #333; }
        .action-btn { background: #555; border: none; color: white; padding: 3px 12px; border-radius: 5px; cursor: pointer; font-size: 11px; box-shadow: 0 3px 0 #222; transition: all 0.1s; }
        .action-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #222; }
        .export-btn { background: #007bff; box-shadow: 0 3px 0 #004a99; }

        /* Preview Area (40%) */
        .preview-area { height: 40dvh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #videoPreview, #imgPreview { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        
        /* Timeline Area (40%) */
        .timeline-area { height: 40dvh; background: #1a1a1a; border-top: 1px solid #333; display: flex; flex-direction: column; overflow-x: auto; }
        .track { height: 33.3%; border-bottom: 1px solid #333; display: flex; align-items: center; padding-left: 10px; }
        .track-label { width: 50px; font-size: 9px; color: #666; font-weight: bold; }
        .clip { height: 70%; background: #007bff; border-radius: 4px; margin: 0 2px; cursor: pointer; min-width: 80px; display: flex; align-items: center; justify-content: center; font-size: 10px; }

        /* Toolbar (15%) */
        .toolbar { height: 15dvh; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .tool-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; color: #ccc; }
        .tool-item span { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="page">
    <div class="top-button-area">
        <button class="action-btn" onclick="window.history.back()">✕</button>
        <div style="display: flex; gap: 8px;">
            <button class="action-btn" onclick="document.getElementById('videoInput').click()">Video</button>
            <button class="action-btn" onclick="document.getElementById('imgInput').click()">Photo</button>
            <button class="action-btn export-btn">Export</button>
        </div>
    </div>

    <div class="preview-area">
        <video id="videoPreview" controls></video>
        <img id="imgPreview">
        <input type="file" id="videoInput" style="display:none;" accept="video/*" multiple>
        <input type="file" id="imgInput" style="display:none;" accept="image/*" multiple>
    </div>

    <div class="timeline-area">
        <div class="track" id="videoTrack"><div class="track-label">Video</div></div>
        <div class="track" id="audioTrack"><div class="track-label">Audio</div></div>
        <div class="track" id="textTrack"><div class="track-label">Text</div></div>
    </div>

    <div class="toolbar">
        <div class="tool-item"><span>✂️</span>Edit</div>
        <div class="tool-item"><span>🎵</span>Audio</div>
        <div class="tool-item"><span>📝</span>Text</div>
        <div class="tool-item"><span>✨</span>Effects</div>
        <div class="tool-item"><span>🖼️</span>Overlay</div>
    </div>
</div>

<script>
    const videoTrack = document.getElementById('videoTrack');
    const videoPreview = document.getElementById('videoPreview');
    const imgPreview = document.getElementById('imgPreview');

    function addClipToTimeline(file) {
        const clip = document.createElement('div');
        clip.className = 'clip';
        clip.innerText = file.name.substring(0, 10) + '...';
        videoTrack.appendChild(clip);

        clip.onclick = () => {
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video')) {
                videoPreview.src = url;
                videoPreview.style.display = 'block';
                imgPreview.style.display = 'none';
            } else {
                imgPreview.src = url;
                imgPreview.style.display = 'block';
                videoPreview.style.display = 'none';
            }
        };
    }

    document.getElementById('videoInput').addEventListener('change', (e) => {
        Array.from(e.target.files).forEach(addClipToTimeline);
    });

    document.getElementById('imgInput').addEventListener('change', (e) => {
        Array.from(e.target.files).forEach(addClipToTimeline);
    });
</script>
</body>
</html>
