<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Video Editor</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Preview Area: အမြဲတမ်း Screen တစ်ဝက် */
        .preview-container {
            height: 50vh;
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Video Original Ratio အတိုင်းပေါ်စေရန် */
        video, img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* ဒါက original ratio မပျက်အောင်လုပ်ပေးတာပါ */
        }

        .import-btn { padding: 15px 30px; background: #333; border: 2px dashed #555; color: #ccc; border-radius: 10px; cursor: pointer; }

        /* Toolbar Area: ကျန်တဲ့ တစ်ဝက် */
        .toolbar {
            height: 50vh;
            background: #1a1a1a;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 10px;
            overflow-y: auto;
        }
        
        .tool-item { width: 20%; display: flex; flex-direction: column; align-items: center; padding: 10px 0; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="preview-container" id="previewArea">
        <button class="import-btn" onclick="document.getElementById('fileInput').click()">Import Video/Photo</button>
        <input type="file" id="fileInput" style="display: none;" accept="video/*, image/*" onchange="loadFile(event)">
        <video id="videoPreview" controls style="display: none;"></video>
        <img id="imagePreview" style="display: none;">
    </div>

    <div class="toolbar">
        <div class="tool-item"><span>✂️</span>Edit</div>
        <div class="tool-item"><span>🎵</span>Audio</div>
        <div class="tool-item"><span>📝</span>Text</div>
        <div class="tool-item"><span>✨</span>Effects</div>
        <div class="tool-item"><span>🖼️</span>Overlay</div>
    </div>

    <script>
        function loadFile(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            document.querySelector('.import-btn').style.display = 'none';
            reader.onload = function(e) {
                if (file.type.startsWith('video/')) {
                    const video = document.getElementById('videoPreview');
                    video.src = e.target.result;
                    video.style.display = 'block';
                } else if (file.type.startsWith('image/')) {
                    const img = document.getElementById('imagePreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
