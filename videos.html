<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>Videos</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .back-btn { display: block; width: fit-content; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 20px; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .video-item { background: white; padding: 10px; border-radius: 12px; text-align: center; }
        .video-item img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅️ Back</a>
    <h1>Translated Movies</h1>
    <div class="video-grid">
        <div class="video-item">
            <img src="poster1.jpg" alt="Movie">
            <p>ဇာတ်ကား ၁</p>
        </div>
    </div>
</body>
</html>
