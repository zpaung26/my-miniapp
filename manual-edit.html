<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Edit Videos</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 20px; }
        
        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 450px;
            margin: auto;
        }

        .btn-manual {
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            font-size: 14px;
            /* 3D Effect */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 3D အောက်ခံ Border */
        .new-video { background: #4caf50; border-bottom: 6px solid #388e3c; }
        .tutorial  { background: #2196f3; border-bottom: 6px solid #1976d2; }
        .save      { background: #ff9800; border-bottom: 6px solid #e65100; }
        .history   { background: #9c27b0; border-bottom: 6px solid #7b1fa2; }

        /* နှိပ်လိုက်ရင် ဖြစ်မယ့် 3D Effect */
        .btn-manual:active { 
            transform: translateY(4px); 
            border-bottom: none; 
            box-shadow: none; 
        }

        .icon { font-size: 24px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅️ Back</a>
    
    <div class="btn-container">
        <button class="btn-manual new-video">
            <span class="icon">➕</span> New Video
        </button>
        <button class="btn-manual tutorial">
            <span class="icon">📚</span> Tutorial
        </button>
        <button class="btn-manual save">
            <span class="icon">💾</span> Save Draft
        </button>
        <button class="btn-manual history">
            <span class="icon">🕒</span> History
        </button>
    </div>
</body>
</html>
